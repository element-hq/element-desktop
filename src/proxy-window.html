<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Network Proxy</title>
        <style>
            :root {
                --background: #ffffff;
                --text-color: #17191c;
                --input-bg: #ffffff;
                --input-border: #e3e8f0;
                --input-border-focus: #0dbd8b;
                --button-bg: #f2f5f8;
                --button-text: #17191c;
                --primary-color: #0dbd8b;
                --primary-text: #ffffff;
                --danger-color: #ff5b55;
                --font-family:
                    "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            }

            @media (prefers-color-scheme: dark) {
                :root {
                    --background: #15191e;
                    --text-color: #ffffff;
                    --input-bg: #21262c;
                    --input-border: #5c6269;
                    --button-bg: #21262c;
                    --button-text: #ffffff;
                }
            }

            body {
                font-family: var(--font-family);
                margin: 0;
                padding: 24px;
                background-color: var(--background);
                color: var(--text-color);
                font-size: 14px;
                line-height: 1.5;
            }

            h1 {
                font-size: 18px;
                font-weight: 600;
                margin: 0 0 24px 0;
            }

            .section {
                background: var(--input-bg);
                border: 1px solid var(--input-border);
                border-radius: 8px;
                padding: 16px;
                margin-bottom: 16px;
            }

            .section-title {
                font-weight: 600;
                margin-bottom: 12px;
                display: block;
            }

            label.radio-option {
                display: flex;
                align-items: center;
                margin-bottom: 8px;
                cursor: pointer;
            }

            label.radio-option input {
                margin-right: 12px;
                accent-color: var(--primary-color);
            }

            label.field-label {
                display: block;
                margin-bottom: 6px;
                font-weight: 500;
                font-size: 12px;
                color: var(--text-color);
                opacity: 0.8;
            }

            input[type="text"],
            input[type="password"],
            input[type="number"],
            select {
                width: 100%;
                box-sizing: border-box;
                padding: 10px;
                border-radius: 4px;
                border: 1px solid var(--input-border);
                background-color: var(--input-bg);
                color: var(--text-color);
                font-family: inherit;
                font-size: 14px;
                outline: none;
                transition: border-color 0.2s;
            }

            input:focus,
            select:focus {
                border-color: var(--primary-color);
            }

            .row {
                display: flex;
                gap: 16px;
                margin-bottom: 12px;
            }

            .row > div {
                flex: 1;
            }

            .actions {
                display: flex;
                justify-content: flex-end;
                gap: 12px;
                margin-top: 24px;
            }

            button {
                padding: 10px 24px;
                border-radius: 20px;
                font-weight: 600;
                cursor: pointer;
                border: none;
                font-size: 14px;
                transition: opacity 0.2s;
            }

            button:hover {
                opacity: 0.9;
            }

            button.secondary {
                background-color: transparent;
                border: 1px solid var(--input-border);
                color: var(--button-text);
            }

            button.primary {
                background-color: var(--primary-color);
                color: var(--primary-text);
            }

            #proxy-status {
                margin-top: 12px;
                font-size: 13px;
                opacity: 0;
                transition: opacity 0.3s;
            }
            #proxy-status.visible {
                opacity: 1;
            }

            .ok {
                color: var(--primary-color);
            }
            .error {
                color: var(--danger-color);
            }

            .helper-text {
                font-size: 12px;
                opacity: 0.6;
                margin-top: 4px;
            }

            .warning-text {
                margin-top: 16px;
                font-size: 12px;
                opacity: 0.7;
                text-align: center;
                font-style: italic;
            }
        </style>
    </head>
    <body>
        <h1 id="t-title">Network Proxy</h1>

        <div class="section">
            <span class="section-title" id="t-mode-title">Connection Mode</span>
            <label class="radio-option">
                <input type="radio" name="mode" id="proxy-mode-system" value="system" />
                <span id="t-mode-system">Use system proxy settings</span>
            </label>
            <label class="radio-option">
                <input type="radio" name="mode" id="proxy-mode-direct" value="direct" />
                <span id="t-mode-direct">No proxy (direct connection)</span>
            </label>
            <label class="radio-option">
                <input type="radio" name="mode" id="proxy-mode-custom" value="custom" />
                <span id="t-mode-custom">Manual configuration</span>
            </label>
        </div>

        <div id="custom-fields" style="display: none">
            <div class="section">
                <div style="margin-bottom: 12px">
                    <label class="field-label" for="proxy-scheme" id="t-protocol">Protocol</label>
                    <select id="proxy-scheme">
                        <option value="http">HTTP</option>
                        <option value="https">HTTPS</option>
                        <option value="socks5">SOCKSv5</option>
                        <option value="socks5h">SOCKSv5 (DNS remote)</option>
                    </select>
                </div>

                <div class="row">
                    <div style="flex: 2">
                        <label class="field-label" for="proxy-host" id="t-host">Proxy Host</label>
                        <input id="proxy-host" type="text" placeholder="" />
                    </div>
                    <div>
                        <label class="field-label" for="proxy-port" id="t-port">Port</label>
                        <input id="proxy-port" type="number" min="1" max="65535" placeholder="" />
                    </div>
                </div>
            </div>

            <div class="section">
                <div class="row">
                    <div>
                        <label class="field-label" for="proxy-username" id="t-username">Username</label>
                        <input id="proxy-username" type="text" autocomplete="off" />
                    </div>
                    <div>
                        <label class="field-label" for="proxy-password" id="t-password">Password</label>
                        <input id="proxy-password" type="password" autocomplete="off" />
                    </div>
                </div>
                <div class="helper-text" id="t-password-help">Configuration is encrypted using the system's secure storage.</div>
            </div>

            <div class="section">
                <label class="field-label" for="proxy-bypass" id="t-bypass">No Proxy For</label>
                <input id="proxy-bypass" type="text" placeholder="" />
            </div>
        </div>

        <div class="actions">
            <button id="proxy-close" class="secondary">Cancel</button>
            <button id="proxy-save" class="primary">Save Changes</button>
        </div>

        <div id="proxy-status"></div>
        <div class="warning-text" id="t-updates-warning"></div>

        <script>
            const api = window && window.proxyApi ? window.proxyApi : null;

            const el = (id) => document.getElementById(id);
            const status = el("proxy-status");
            const customFields = el("custom-fields");

            function setStatus(msg, cls) {
                status.textContent = msg || "";
                status.className = cls || "";
                status.classList.add("visible");
            }

            function getMode() {
                if (el("proxy-mode-custom").checked) return "custom";
                if (el("proxy-mode-direct").checked) return "direct";
                return "system";
            }

            function applyModeUI() {
                const mode = getMode();
                customFields.style.display = mode === "custom" ? "block" : "none";
                if (window.resizeToContent) setTimeout(window.resizeToContent, 10);
            }

            function fillForm(cfg) {
                if (!cfg) return;
                const mode = cfg.mode || "system";
                el("proxy-mode-system").checked = mode === "system";
                el("proxy-mode-direct").checked = mode === "direct";
                el("proxy-mode-custom").checked = mode === "custom";
                el("proxy-scheme").value = cfg.scheme || "http";
                el("proxy-host").value = cfg.host || "";
                el("proxy-port").value = cfg.port != null ? String(cfg.port) : "";
                el("proxy-username").value = cfg.username || "";
                el("proxy-password").value = cfg.password || "";
                el("proxy-bypass").value = cfg.bypass || "";
                applyModeUI();
            }

            function readForm() {
                const mode = getMode();
                if (mode !== "custom") return { mode };
                const host = el("proxy-host").value.trim();
                const portStr = el("proxy-port").value.trim();
                const port = Number(portStr);
                const scheme = el("proxy-scheme").value;
                const username = el("proxy-username").value;
                const password = el("proxy-password").value;
                const bypass = el("proxy-bypass").value;

                if (!host || !portStr) {
                    throw new Error("Host and port are required.");
                }
                if (!Number.isInteger(port) || port < 1 || port > 65535) {
                    throw new Error("Invalid port number.");
                }
                return { mode, scheme, host, port, username, password, bypass };
            }

            function applyStrings(strings) {
                if (!strings) return;
                const setText = (id, val) => {
                    const e = el(id);
                    if (e && val) e.textContent = val;
                };

                setText("t-title", strings.title);
                document.title = strings.title || "Network Proxy";
                
                setText("t-mode-system", strings.mode_system);
                setText("t-mode-direct", strings.mode_direct);
                setText("t-mode-custom", strings.mode_custom);

                setText("t-protocol", strings.protocol);
                setText("t-host", strings.host);
                setText("t-port", strings.port);
                setText("t-bypass", strings.bypass);
                setText("t-username", strings.username);
                setText("t-password", strings.password);
                setText("t-password-help", strings.password_help);
                setText("t-updates-warning", strings.updates_warning);

                setText("proxy-close", strings.cancel);
                setText("proxy-save", strings.save);
            }

            function init() {
                window.resizeToContent = () => {
                    if (api?.resizeWindow) {
                        const height = document.body.offsetHeight;
                        const width = 540;
                        api.resizeWindow(width, height);
                    }
                };

                const resizeObserver = new ResizeObserver(() => {
                    window.resizeToContent();
                });
                resizeObserver.observe(document.body);

                el("proxy-mode-system").addEventListener("change", applyModeUI);
                el("proxy-mode-direct").addEventListener("change", applyModeUI);
                el("proxy-mode-custom").addEventListener("change", applyModeUI);

                el("proxy-close").addEventListener("click", () => {
                    api?.closeWindow?.();
                    window.close();
                });

                el("proxy-save").addEventListener("click", async () => {
                    let cfg;
                    try {
                        cfg = readForm();
                    } catch (e) {
                        setStatus(e.message || String(e), "error");
                        return;
                    }
                    if (!api?.saveProxyConfig) {
                        setStatus("Cannot save settings (API missing).", "error");
                        return;
                    }

                    setStatus("Saving...", "");
                    const res = await api.saveProxyConfig(cfg);
                    if (res.ok) {
                        setStatus("Settings saved successfully.", "ok");
                        setTimeout(() => {
                            api?.closeWindow?.();
                            window.close();
                        }, 800);
                    } else {
                        setStatus("Failed to save: " + (res.error || "unknown"), "error");
                    }
                });

                if (!api) {
                     setStatus("API not found", "error");
                     return;
                }
                
                // Fetch strings and config
                Promise.all([
                    api.getStrings ? api.getStrings() : Promise.resolve(null),
                    api.getProxyConfig ? api.getProxyConfig() : Promise.resolve(null)
                ]).then(([strings, cfg]) => {
                    if (strings) applyStrings(strings);
                    fillForm(cfg || { mode: "system" });
                }).catch(err => {
                    console.error(err);
                    setStatus("Failed to load settings.", "error");
                })
            }

            document.addEventListener("DOMContentLoaded", init);
        </script>
    </body>
</html>
